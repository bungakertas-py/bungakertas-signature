<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>bungakertas — From Sky to Data</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-velocity@1.7.0/dist/leaflet-velocity.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="stage">
    <div id="map"></div>

    <!-- Overlay UI (pointer-events none; panel di-enable) -->
    <div id="ui">
      <!-- ============ TOP ============ -->
      <div class="ui-top">
        <!-- kiri: layer + model -->
        <div class="col">
          <div class="panel brand">
            <svg class="brand-logo" viewBox="0 0 48 48" width="38" height="38" aria-hidden="true">
              <g transform="translate(24 24)" stroke="#1c1b1b" stroke-width="2" stroke-linejoin="round">
                <g fill="#e64980">
                  <ellipse cx="0" cy="-12" rx="8.5" ry="12"/>
                  <ellipse cx="0" cy="-12" rx="8.5" ry="12" transform="rotate(120)"/>
                  <ellipse cx="0" cy="-12" rx="8.5" ry="12" transform="rotate(240)"/>
                </g>
                <circle r="4.5" fill="#ffd43b"/>
              </g>
            </svg>
            <div class="brand-text">
              <strong>bungakertas</strong>
              <span>From Sky to Data</span>
            </div>
          </div>

          <div class="panel layers">
            <button class="layer-btn active" data-layer="wind_surface">
              <span class="material-symbols-outlined">air</span> Angin
            </button>
            <button class="layer-btn disabled" title="Fase berikutnya"><span class="material-symbols-outlined">rainy</span> Hujan</button>
            <button class="layer-btn disabled" title="Fase berikutnya"><span class="material-symbols-outlined">thermostat</span> Suhu</button>
            <button class="layer-btn disabled" title="Fase berikutnya"><span class="material-symbols-outlined">humidity_percentage</span> Kelembapan</button>
            <button class="layer-btn disabled" title="Fase berikutnya"><span class="material-symbols-outlined">cloud</span> Tutupan Awan</button>
            <button class="layer-btn disabled" title="Fase berikutnya"><span class="material-symbols-outlined">speed</span> Tekanan</button>
          </div>

          <div class="panel selects">
            <div class="field">
              <div class="label-caps">MODEL</div>
              <div class="select-wrap">
                <select id="model-select"><option>GFS (NOAA)</option></select>
                <span class="material-symbols-outlined">arrow_drop_down</span>
              </div>
            </div>
            <div class="field">
              <div class="label-caps">LEVEL</div>
              <div class="select-wrap">
                <select id="level-select" disabled><option>Surface</option></select>
                <span class="material-symbols-outlined">arrow_drop_down</span>
              </div>
            </div>
            <div class="field">
              <div class="label-caps">INITIAL_TIME</div>
              <div class="select-wrap">
                <select id="init-select" disabled><option id="init-opt">—</option></select>
                <span class="material-symbols-outlined">schedule</span>
              </div>
            </div>
          </div>
        </div>

        <!-- kanan: lang + zoom + search -->
        <div class="col items-end">
          <div class="lang">
            <button class="active">ID</button>
            <button disabled title="Segera">EN</button>
          </div>
          <div class="zoom">
            <button id="zoom-in" title="Perbesar"><span class="material-symbols-outlined">add</span></button>
            <button id="zoom-out" title="Perkecil"><span class="material-symbols-outlined">remove</span></button>
          </div>
          <button class="icon-btn" disabled title="Cari (segera)"><span class="material-symbols-outlined">search</span></button>
        </div>
      </div>

      <!-- ============ BOTTOM: slider (kiri) + legenda (kanan) ============ -->
      <div class="ui-bottom">
        <!-- timeline / slider — bawah kiri -->
        <div class="panel timeline">
          <div class="tl-btns">
            <button id="play-btn" class="tl-btn" title="Play/Pause"><span class="material-symbols-outlined" id="play-icon">play_arrow</span></button>
          </div>
          <div class="tl-main">
            <div class="tl-cur"><span class="mono" id="valid-time">—</span></div>
            <input type="range" id="time-slider" min="0" max="0" value="0" step="1" />
            <div id="tl-ticks" class="tl-ticks"></div>
          </div>
        </div>

        <!-- legenda — bawah kanan -->
        <div class="legend-panel">
          <div class="legend-head mono">KNOTS</div>
          <div class="legend">
            <div class="legend-cell dark" style="background:#2b83ba">5</div>
            <div class="legend-cell" style="background:#5aa8cf">10</div>
            <div class="legend-cell" style="background:#abdda4">15</div>
            <div class="legend-cell" style="background:#66bd63">20</div>
            <div class="legend-cell" style="background:#d9ef8b">25</div>
            <div class="legend-cell" style="background:#fee08b">34</div>
            <div class="legend-cell" style="background:#fdae61">48</div>
            <div class="legend-cell dark" style="background:#f46d43">64</div>
            <div class="legend-cell dark" style="background:#d73027">80</div>
            <div class="legend-cell dark" style="background:#a50026">100+</div>
          </div>
        </div>
      </div>
    </div>

    <div id="loading">Memuat data model…</div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-velocity@1.7.0/dist/leaflet-velocity.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
