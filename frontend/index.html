<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Kertas Cuaca — From Sky to Data</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-velocity@1.7.0/dist/leaflet-velocity.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="stage">
    <div id="map"></div>

    <!-- Overlay UI (pointer-events none; panel di-enable) -->
    <div id="ui">
      <!-- ============ TOP ============ -->
      <div class="ui-top">
        <!-- kiri: layer + model -->
        <div class="col">
          <div class="panel brand">
            <svg class="brand-logo" viewBox="0 0 48 48" width="38" height="38" aria-hidden="true">
              <g transform="translate(24 24)" stroke="#1c1b1b" stroke-width="2" stroke-linejoin="round">
                <g fill="#e64980">
                  <ellipse cx="0" cy="-12" rx="8.5" ry="12"/>
                  <ellipse cx="0" cy="-12" rx="8.5" ry="12" transform="rotate(120)"/>
                  <ellipse cx="0" cy="-12" rx="8.5" ry="12" transform="rotate(240)"/>
                </g>
                <circle r="4.5" fill="#ffd43b"/>
              </g>
            </svg>
            <div class="brand-text">
              <strong>Kertas Cuaca</strong>
              <span>From Sky to Data</span>
            </div>
          </div>

          <div class="panel layers">
            <button class="layer-btn active" data-layer="wind_surface">
              <span class="material-symbols-outlined">air</span> Angin
            </button>
            <button class="layer-btn" data-layer="rain_surface"><span class="material-symbols-outlined">rainy</span> Hujan</button>
            <button class="layer-btn" data-layer="rain_accum_surface"><span class="material-symbols-outlined">water_drop</span> Akum. Hujan 24J</button>
            <button class="layer-btn" data-layer="temp_surface"><span class="material-symbols-outlined">thermostat</span> Suhu</button>
            <button class="layer-btn" data-layer="humidity_surface"><span class="material-symbols-outlined">humidity_percentage</span> Kelembapan</button>
            <button class="layer-btn" data-layer="cloud_surface"><span class="material-symbols-outlined">cloud</span> Tutupan Awan</button>
            <button class="layer-btn" data-layer="pressure_surface"><span class="material-symbols-outlined">speed</span> Tekanan</button>
          </div>

          <div class="panel selects">
            <div class="field">
              <div class="label-caps">MODEL</div>
              <div class="select-wrap">
                <select id="model-select"><option>GFS (NOAA)</option></select>
                <span class="material-symbols-outlined">arrow_drop_down</span>
              </div>
            </div>
            <div class="field">
              <div class="label-caps">LEVEL</div>
              <div class="select-wrap">
                <select id="level-select" disabled><option>Surface</option></select>
                <span class="material-symbols-outlined">arrow_drop_down</span>
              </div>
            </div>
            <div class="field">
              <div class="label-caps">INITIAL_TIME</div>
              <div class="select-wrap">
                <select id="init-select" disabled><option id="init-opt">—</option></select>
                <span class="material-symbols-outlined">schedule</span>
              </div>
            </div>
          </div>
        </div>

        <!-- kanan: lang + zoom + search -->
        <div class="col items-end">
          <div class="lang">
            <button class="active">ID</button>
            <button disabled title="Segera">EN</button>
          </div>
          <div class="zoom">
            <button id="zoom-in" title="Perbesar"><span class="material-symbols-outlined">add</span></button>
            <button id="zoom-out" title="Perkecil"><span class="material-symbols-outlined">remove</span></button>
          </div>
          <button id="geo-btn" class="icon-btn" title="Cuaca di lokasi saya"><span class="material-symbols-outlined">my_location</span></button>
          <button id="city-toggle" class="icon-btn" title="Ikon kondisi cuaca per kota (nyalakan/matikan)"><span class="material-symbols-outlined">partly_cloudy_day</span></button>
          <div class="search-wrap">
            <button id="search-btn" class="icon-btn" title="Cari kota / kabupaten"><span class="material-symbols-outlined">search</span></button>
            <div id="search-box" class="search-box">
              <input id="search-input" type="text" placeholder="Cari kota / kabupaten…" autocomplete="off" />
              <div id="search-results" class="search-results"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- ============ BOTTOM: slider (kiri) + legenda (kanan) ============ -->
      <div class="ui-bottom">
        <!-- timeline / slider — bawah kiri -->
        <div class="panel timeline">
          <div class="tl-btns">
            <button id="play-btn" class="tl-btn" title="Play/Pause"><span class="material-symbols-outlined" id="play-icon">play_arrow</span></button>
          </div>
          <div class="tl-main">
            <div class="tl-cur"><span class="mono" id="valid-time">—</span></div>
            <input type="range" id="time-slider" min="0" max="0" value="0" step="1" />
            <div id="tl-ticks" class="tl-ticks"></div>
          </div>
        </div>

        <!-- legenda — bawah kanan (legenda ikon kondisi di atas, muncul saat toggle) -->
        <div class="legend-col">
          <div id="cond-legend" class="cond-legend"></div>
          <div class="legend-panel">
            <div class="legend-head mono" id="legend-head">KNOTS</div>
            <div class="legend" id="legend-cells"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Skeleton loading — meniru layout UI biar transisi mulus saat refresh -->
    <div id="skeleton" aria-hidden="true">
      <div class="sk-top">
        <div class="sk-col">
          <div class="sk-panel sk-brand">
            <div class="sk-bar sk-logo"></div>
            <div class="sk-lines">
              <div class="sk-bar sk-line-lg"></div>
              <div class="sk-bar sk-line-sm"></div>
            </div>
          </div>
          <div class="sk-panel sk-layers">
            <div class="sk-bar"></div><div class="sk-bar"></div><div class="sk-bar"></div>
            <div class="sk-bar"></div><div class="sk-bar"></div><div class="sk-bar"></div>
            <div class="sk-bar"></div>
          </div>
          <div class="sk-panel sk-selects">
            <div class="sk-bar"></div><div class="sk-bar"></div><div class="sk-bar"></div>
          </div>
        </div>
        <div class="sk-col sk-right">
          <div class="sk-bar sk-mini"></div>
          <div class="sk-bar sk-mini"></div>
          <div class="sk-bar sk-mini"></div>
          <div class="sk-bar sk-mini"></div>
        </div>
      </div>
      <div class="sk-bottom">
        <div class="sk-bar sk-slider"></div>
        <div class="sk-bar sk-legend"></div>
      </div>
      <div class="sk-center">
        <svg class="sk-mark" viewBox="0 0 48 48" width="60" height="60" aria-hidden="true">
          <g transform="translate(24 24)" stroke="#1c1b1b" stroke-width="2" stroke-linejoin="round">
            <g fill="#e64980">
              <ellipse cx="0" cy="-12" rx="8.5" ry="12"/>
              <ellipse cx="0" cy="-12" rx="8.5" ry="12" transform="rotate(120)"/>
              <ellipse cx="0" cy="-12" rx="8.5" ry="12" transform="rotate(240)"/>
            </g>
            <circle r="4.5" fill="#ffd43b"/>
          </g>
        </svg>
        <div class="sk-load-text mono">Memuat data cuaca…</div>
      </div>
    </div>

    <div id="loading">Memuat data model…</div>

    <!-- Panel detail titik (muncul saat klik peta) -->
    <aside id="point-panel">
      <div class="pt-head">
        <div class="pt-head-top">
          <span class="badge badge-lime">TITIK TERPILIH</span>
          <div class="pt-head-btns">
            <button id="pt-hide" class="pt-close" title="Sembunyikan"><span class="material-symbols-outlined">chevron_right</span></button>
            <button id="pt-close" class="pt-close" title="Tutup"><span class="material-symbols-outlined">close</span></button>
          </div>
        </div>
        <div class="pt-coords mono" id="pt-coords">—</div>
      </div>
      <div class="pt-body" id="pt-body"></div>
      <div class="pt-foot">
        <button id="pt-export" class="pt-export"><span class="material-symbols-outlined">download</span> EXPORT CSV</button>
      </div>
    </aside>
    <button id="pt-reopen" title="Tampilkan detail titik"><span class="material-symbols-outlined">chevron_left</span></button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-velocity@1.7.0/dist/leaflet-velocity.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
